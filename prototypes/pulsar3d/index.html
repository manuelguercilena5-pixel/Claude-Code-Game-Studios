<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010F">
<title>Pulsar 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05010F; --fg: #E8FFFF; --dim: rgba(232,255,255,.58); --cyan: #00F0FF; --pink: #FF2E88;
    --gold: #FFF35C; --mint: #4DFFC3; --violet: #B04CFF; --amber: #FFB000; --green: #7CFF4F; --red: #FF3B30;
    --panel: rgba(8,3,24,.62);
    --h: 'Orbitron', 'Rajdhani', system-ui, sans-serif; --b: 'Rajdhani', 'Orbitron', system-ui, sans-serif;
    --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #05010F; --fg: #E8FFFF; } }
  :root[data-theme="dark"] { --bg: #05010F; --fg: #E8FFFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--b);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }
  .glow { text-shadow: 0 0 8px currentColor, 0 0 22px currentColor; }

  /* ---------- HUD ---------- */
  #hud { padding: calc(18px + var(--st)) calc(20px + var(--sr)) calc(18px + var(--sb)) calc(20px + var(--sl)); }
  .score-lbl { font: 700 11px var(--b); letter-spacing: .25em; color: var(--dim); }
  #score { font: 900 34px var(--h); font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 0 10px rgba(0,240,255,.7), 0 0 26px rgba(0,240,255,.35); line-height: 1.05; }
  #sub { font: 700 12px var(--h); color: var(--dim); margin-top: 2px; }
  #sub.best { color: var(--gold); }
  #multWrap { position: absolute; left: 50%; top: calc(14px + var(--st)); transform: translateX(-50%); text-align: center; }
  #mult { font: 900 44px var(--h); color: var(--gold); text-shadow: 0 0 12px rgba(255,243,92,.85), 0 0 34px rgba(255,200,60,.5); transition: transform .08s; }
  #bar { display: flex; gap: 4px; justify-content: center; margin-top: 2px; }
  #bar i { width: 14px; height: 4px; background: rgba(255,243,92,.16); border-radius: 1px; }
  #bar i.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  #chain { font: 900 13px var(--h); color: var(--pink); margin-top: 8px; text-shadow: 0 0 8px var(--pink); letter-spacing: .1em; height: 18px; }
  #chainBar { height: 2px; background: var(--pink); margin: 2px auto 0; width: 0; box-shadow: 0 0 6px var(--pink); }
  #lives { position: absolute; right: calc(20px + var(--sr)); top: calc(66px + var(--st)); display: flex; gap: 6px; }
  #lives svg { width: 20px; height: 20px; filter: drop-shadow(0 0 5px var(--cyan)); }
  #powers { position: absolute; left: 50%; bottom: calc(26px + var(--sb)); transform: translateX(-50%); display: flex; gap: 18px; }
  .pw { width: 150px; font: 700 11px var(--h); letter-spacing: .12em; }
  .pw b { display: block; height: 4px; margin-top: 4px; background: rgba(255,255,255,.12); }
  .pw b s { display: block; height: 100%; background: currentColor; box-shadow: 0 0 8px currentColor; text-decoration: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: calc(64px + var(--sb)); text-align: center; transition: opacity .6s; padding: 0 16px; }
  #hint .a { font: 700 14px var(--h); letter-spacing: .08em; color: var(--fg); text-shadow: 0 0 8px rgba(0,240,255,.6); }
  #hint .b { font: 600 16px var(--b); color: var(--gold); margin-top: 6px; }
  @media (max-width: 760px) {
    #score { font-size: 26px; } #multWrap { top: calc(78px + var(--st)); } #mult { font-size: 38px; }
    .pw { width: 110px; }
  }

  /* ---------- buttons ---------- */
  #btns { position: fixed; top: calc(14px + var(--st)); right: calc(16px + var(--sr)); display: flex; gap: 10px; pointer-events: auto; }
  .ib { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--cyan); background: rgba(5,1,15,.55); color: var(--fg);
    display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 0 10px rgba(0,240,255,.35), inset 0 0 8px rgba(0,240,255,.15); transition: transform .1s, box-shadow .2s; }
  .ib:hover { transform: scale(1.08); box-shadow: 0 0 16px rgba(0,240,255,.7), inset 0 0 10px rgba(0,240,255,.25); }
  .ib.off { border-color: rgba(232,255,255,.3); box-shadow: none; color: rgba(232,255,255,.45); }
  .ib svg { width: 18px; height: 18px; }
  .ib:focus-visible, .mode:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ---------- overlays ---------- */
  .ov { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  .logo { font: 400 clamp(64px, 15vw, 150px) 'Monoton', var(--h); color: #fff; line-height: 1; letter-spacing: .02em;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--pink), 0 0 42px var(--pink), 0 0 90px rgba(255,46,136,.6); animation: flick 6s infinite; }
  @keyframes flick { 0%, 91%, 94%, 100% { opacity: 1; } 92% { opacity: .55; } 93% { opacity: .9; } 95% { opacity: .7; } }
  .tag { font: 700 clamp(12px, 2.2vw, 18px) var(--h); letter-spacing: .45em; color: var(--cyan); margin: 14px 0 0; text-shadow: 0 0 10px var(--cyan); padding-left: .45em; }
  #title { justify-content: flex-start; padding-top: calc(9vh + var(--st)); }
  #modes { display: flex; gap: 18px; margin-top: 7vh; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
  .mode { width: min(230px, 42vw); padding: 12px 10px 10px; background: rgba(5,1,15,.55); border: 2px solid var(--c); color: var(--fg); cursor: pointer;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); box-shadow: inset 0 0 18px color-mix(in srgb, var(--c) 30%, transparent);
    transition: background .15s, transform .1s; font: inherit; }
  .mode:hover { background: color-mix(in srgb, var(--c) 18%, rgba(5,1,15,.6)); transform: translateY(-2px); }
  .mode b { display: block; font: 900 clamp(15px, 3vw, 20px) var(--h); letter-spacing: .08em; text-shadow: 0 0 10px var(--c); }
  .mode small { display: block; margin-top: 3px; font: 700 12px var(--b); color: var(--c); letter-spacing: .05em; }
  #play { --c: var(--cyan); animation: breathe 2s ease-in-out infinite; }
  #daily { --c: var(--pink); }
  @keyframes breathe { 50% { box-shadow: inset 0 0 28px rgba(0,240,255,.45), 0 0 18px rgba(0,240,255,.35); } }
  #bestLine { margin-top: 16px; font: 700 14px var(--h); color: var(--gold); text-shadow: 0 0 8px rgba(255,243,92,.6); letter-spacing: .08em; min-height: 18px; }
  #legend { position: fixed; inset: 0; pointer-events: none; }
  .lg { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; }
  .lg b { font: 900 12px var(--h); letter-spacing: .12em; color: var(--c); text-shadow: 0 0 8px var(--c); }
  .lg small { display: block; font: 600 13px var(--b); color: var(--dim); }
  #controls { position: fixed; left: 0; right: 0; bottom: calc(14px + var(--sb)); text-align: center; font: 600 14px var(--b); color: var(--dim); padding: 0 12px; }
  .kbd { display: inline-block; border: 1px solid rgba(232,255,255,.35); border-radius: 4px; padding: 0 5px; font: 700 11px var(--h); margin: 0 2px; }

  #over { background: radial-gradient(ellipse at center, rgba(5,1,15,.35), rgba(5,1,15,.82)); opacity: 0; transition: opacity .5s; }
  #over.show { opacity: 1; }
  .go { font: 400 clamp(46px, 10vw, 96px) 'Monoton', var(--h); color: #fff; text-shadow: 0 0 6px #fff, 0 0 20px var(--pink), 0 0 50px var(--pink); line-height: 1; }
  #rank { font: 900 16px var(--h); color: var(--cyan); letter-spacing: .3em; margin-top: 14px; text-shadow: 0 0 10px var(--cyan); padding-left: .3em; }
  #final { font: 900 clamp(44px, 9vw, 72px) var(--h); font-variant-numeric: tabular-nums; margin-top: 6px; text-shadow: 0 0 14px rgba(0,240,255,.7), 0 0 40px rgba(0,240,255,.35); }
  #delta { font: 700 17px var(--b); color: var(--dim); min-height: 26px; }
  #delta.nb { font: 900 22px var(--h); color: var(--gold); text-shadow: 0 0 14px var(--gold); animation: pop .6s ease-in-out infinite alternate; }
  @keyframes pop { to { transform: scale(1.07); } }
  #stats { display: grid; grid-template-columns: repeat(5, minmax(60px, 110px)); gap: 6px; margin-top: 22px; padding: 12px 10px; background: var(--panel); border: 1px solid rgba(176,76,255,.35);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  #stats div small { display: block; font: 700 11px var(--b); letter-spacing: .2em; color: var(--dim); }
  #stats div b { font: 900 20px var(--h); }
  .menu { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  .mbtn { --c: var(--cyan); min-width: 150px; padding: 13px 18px; font: 900 15px var(--h); letter-spacing: .12em; color: var(--fg); cursor: pointer;
    background: color-mix(in srgb, var(--c) 14%, rgba(5,1,15,.7)); border: 2px solid var(--c); box-shadow: inset 0 0 16px color-mix(in srgb, var(--c) 30%, transparent);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: background .15s, transform .1s; }
  .mbtn:hover, .mbtn:focus-visible { background: color-mix(in srgb, var(--c) 30%, rgba(5,1,15,.7)); transform: translateY(-2px); outline: none; }
  .mbtn.pri { animation: breathe 2s ease-in-out infinite; }
  .mbtn.alt { --c: var(--pink); }
  .mbtn.dim { --c: rgba(232,255,255,.5); }
  .keys { font: 600 13px var(--b); color: rgba(232,255,255,.45); margin-top: 10px; }
  @keyframes blink { 50% { opacity: .45; } }
  #pause { background: rgba(5,1,15,.6); }
  #pause h2 { font: 900 clamp(40px, 9vw, 64px) var(--h); color: var(--cyan); margin: 0; text-shadow: 0 0 14px var(--cyan), 0 0 40px var(--cyan); letter-spacing: .1em; }
  #pause p { font: 600 16px var(--b); color: var(--dim); }

  #banners { position: fixed; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  .bn { font: 900 clamp(26px, 6vw, 48px) var(--h); letter-spacing: .08em; color: var(--c); text-shadow: 0 0 10px var(--c), 0 0 34px var(--c); text-align: center;
    animation: bn var(--d, 1.8s) ease-out forwards; }
  .bn small { display: block; font: 600 16px var(--b); color: var(--fg); letter-spacing: .05em; text-shadow: none; opacity: .85; }
  @keyframes bn { 0% { opacity: 0; transform: scale(1.7); } 10% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1.04); } 100% { opacity: 0; transform: scale(1.06); } }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pp { position: absolute; left: 0; top: 0; font: 900 16px var(--h); white-space: nowrap; will-change: transform, opacity; text-shadow: 0 0 8px currentColor; }
  #stick, #aimStick { position: fixed; left: 0; top: 0; pointer-events: none; }
  #stick i, #aimStick i { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  body.touch #hint { bottom: calc(140px + var(--sb)); } body.touch #dash { display: none; } body.touch #powers { bottom: calc(130px + var(--sb)); }
  #aimStick .base { width: 110px; height: 110px; border: 2px solid rgba(255,46,136,.5); box-shadow: 0 0 14px rgba(255,46,136,.3), inset 0 0 14px rgba(255,46,136,.2); }
  #aimStick .knob { width: 46px; height: 46px; background: rgba(255,46,136,.25); border: 2px solid rgba(255,220,240,.7); box-shadow: 0 0 12px rgba(255,46,136,.6); }
  #stick .base { width: 110px; height: 110px; border: 2px solid rgba(0,240,255,.4); box-shadow: 0 0 14px rgba(0,240,255,.25), inset 0 0 14px rgba(0,240,255,.2); }
  #stick .knob { width: 46px; height: 46px; background: rgba(0,240,255,.22); border: 2px solid rgba(232,255,255,.6); box-shadow: 0 0 12px rgba(0,240,255,.5); }
  #loading { background: var(--bg); font: 700 14px var(--h); letter-spacing: .3em; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); transition: opacity .6s; }
  /* ---------- phase 1: dash, sectors, boss, cards, share ---------- */
  #sector { position: absolute; right: calc(20px + var(--sr)); top: calc(96px + var(--st)); font: 700 11px var(--h); letter-spacing: .2em; color: var(--dim); text-align: right; }
  #bossWrap { position: absolute; left: 50%; top: calc(112px + var(--st)); transform: translateX(-50%); width: min(520px, 64vw); text-align: center; }
  #bossName { font: 900 13px var(--h); letter-spacing: .3em; color: var(--pink); text-shadow: 0 0 8px var(--pink); }
  #bossHp { height: 6px; margin-top: 5px; background: rgba(255,46,136,.14); border: 1px solid rgba(255,46,136,.55); }
  #bossHp i { display: block; height: 100%; width: 100%; background: var(--pink); box-shadow: 0 0 10px var(--pink); }
  #dash { position: absolute; left: calc(20px + var(--sl)); bottom: calc(24px + var(--sb)); font: 700 11px var(--h); letter-spacing: .18em; color: var(--dim); }
  #dash.ready { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  #dash b { display: block; width: 120px; height: 4px; margin-top: 5px; background: rgba(0,240,255,.14); }
  #dash b s { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); text-decoration: none; }
  #dashBtn { position: fixed; right: calc(22px + var(--sr)); bottom: calc(34px + var(--sb)); width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--cyan);
    background: rgba(0,240,255,.12); color: var(--fg); font: 900 13px var(--h); letter-spacing: .1em; pointer-events: auto; box-shadow: 0 0 16px rgba(0,240,255,.45), inset 0 0 14px rgba(0,240,255,.25); touch-action: none; }
  #dashBtn.cool { opacity: .35; box-shadow: none; }
  #draft { background: rgba(7,5,26,.9); pointer-events: auto; }
  #draft h3 { font: 900 clamp(22px, 4.6vw, 34px) var(--h); letter-spacing: .12em; color: var(--gold); text-shadow: 0 0 14px var(--gold); margin: 0 0 6px; text-wrap: balance; }
  #draft p { font: 600 15px var(--b); color: var(--dim); margin: 0 0 22px; }
  #cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 760px; }
  .card { --c: var(--cyan); width: min(220px, 44vw); min-height: 210px; padding: 16px 14px 14px; color: var(--fg); cursor: pointer; text-align: left; font: inherit;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 16%, rgba(8,3,24,.94)), rgba(8,3,24,.94)); border: 2px solid var(--c);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    box-shadow: inset 0 0 26px color-mix(in srgb, var(--c) 26%, transparent); display: flex; flex-direction: column; gap: 8px;
    transition: transform .12s, box-shadow .2s; animation: deal .4s cubic-bezier(.2, 1.4, .4, 1) backwards; }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
  .card:hover, .card:focus-visible { transform: translateY(-6px); box-shadow: inset 0 0 36px color-mix(in srgb, var(--c) 45%, transparent), 0 0 24px color-mix(in srgb, var(--c) 50%, transparent); outline: none; }
  .card .k { font: 700 11px var(--h); color: var(--dim); letter-spacing: .2em; }
  .card b { font: 900 17px var(--h); letter-spacing: .06em; color: var(--c); text-shadow: 0 0 10px var(--c); }
  .card span { font: 600 16px/1.3 var(--b); }
  .card small { margin-top: auto; font: 700 11px var(--h); color: var(--dim); letter-spacing: .1em; }
  .card.syn { --c: var(--gold); }
  @media (max-width: 560px) { #cards { gap: 10px; } .card { width: min(340px, 92vw); min-height: 0; padding: 12px 14px; gap: 4px; } .card span { font-size: 15px; } }
  @keyframes deal { from { opacity: 0; transform: translateY(40px) scale(.9); } }
  #killedBy { font: 600 16px var(--b); color: var(--dim); margin-top: 2px; }
  #build { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 560px; margin-top: 14px; min-height: 4px; }
  #build i { font: 700 11px var(--h); letter-spacing: .08em; padding: 3px 8px; border: 1px solid var(--c); color: var(--c); font-style: normal; }
  #shareRow { display: flex; gap: 10px; margin-top: 18px; pointer-events: auto; }
  .sbtn { font: 900 13px var(--h); letter-spacing: .1em; padding: 10px 18px; background: rgba(5,1,15,.6); border: 1.5px solid var(--pink); color: var(--fg); cursor: pointer;
    box-shadow: inset 0 0 12px rgba(255,46,136,.25); }
  .sbtn:hover { background: rgba(255,46,136,.18); }
  @media (max-width: 560px) { #aimMode .d { display: none; } }
  #aimMode { position: fixed; left: calc(16px + var(--sl)); top: calc(14px + var(--st)); pointer-events: auto; border-color: var(--cyan); font-size: 11px; padding: 9px 12px; }
  @media (max-height: 600px) { .go { font-size: clamp(34px, 7vw, 56px); } #final { font-size: 40px; margin-top: 0; } #rank { margin-top: 6px; }
    #stats { margin-top: 10px; padding: 8px; } #build { margin-top: 8px; } #shareRow { margin-top: 10px; } .menu { margin-top: 12px; } .mbtn { padding: 10px 14px; } }
  @media (max-width: 760px) { #bossWrap { top: calc(150px + var(--st)); } #sector { left: 0; right: 0; text-align: center; top: calc(62px + var(--st)); } #multWrap { top: calc(80px + var(--st)); } #stats { grid-template-columns: repeat(5, minmax(54px, 1fr)); } }
  #err { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 600 18px var(--b); padding: 24px; text-align: center; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

} }
</script>

<body>
<canvas id="view" tabindex="0" aria-label="Pulsar 3D — neon arena shooter"></canvas>

<div id="hud" class="layer hidden">
  <div class="score-lbl">SCORE</div>
  <div id="score">0</div>
  <div id="sub">00:00</div>
  <div id="multWrap"><div id="mult">×1</div><div id="bar"></div><div id="chain"></div><div id="chainBar"></div></div>
  <div id="lives"></div>
  <div id="powers"></div>
  <div id="sector"></div>
  <div id="bossWrap" class="hidden"><div id="bossName">THE WARDEN</div><div id="bossHp"><i></i></div></div>
  <div id="dash">PHASE DASH<b><s></s></b></div>
  <div id="hint"><div class="a"></div><div class="b">collect gold sparks ◆ to raise your multiplier · dash THROUGH enemies for PHASE points</div></div>
</div>

<div id="title" class="layer ov">
  <div class="logo">PULSAR</div>
  <div class="tag">NEON ARENA SHOOTER</div>
  <div id="modes">
    <button class="mode" id="play"><b>PLAY</b><small>click · tap · space</small></button>
    <button class="mode" id="daily"><b>DAILY PULSE</b><small id="dailySub">same run for everyone · Y</small></button>
  </div>
  <div id="bestLine"></div>
  <button id="aimMode" class="sbtn">AIM: MANUAL</button>
</div>
<div id="legend" class="hidden"></div>
<div id="controls"></div>

<div id="over" class="layer ov hidden">
  <div class="go">GAME OVER</div>
  <div id="rank">CADET</div>
  <div id="final">0</div>
  <div id="delta"></div>
  <div id="killedBy"></div>
  <div id="stats"></div>
  <div id="build"></div>
  <div id="shareRow"><button class="sbtn" id="shareBtn">COPY RESULT</button></div>
  <div class="menu"><button class="mbtn pri" id="retryBtn">RETRY</button><button class="mbtn dim" id="overMenuBtn">MAIN MENU</button></div>
  <div class="keys" id="overKeys">R · retry &nbsp; T · menu</div>
</div>
<div id="draft" class="layer ov hidden"><h3>CHOOSE AN UPGRADE</h3><p id="draftSub">pick one · keys 1 2 3</p><div id="cards"></div></div>
<div id="pause" class="layer ov hidden"><h2>PAUSED</h2>
  <div class="menu"><button class="mbtn pri" id="resumeBtn">RESUME</button><button class="mbtn alt" id="restartBtn">RESTART</button><button class="mbtn dim" id="pauseMenuBtn">MAIN MENU</button></div>
  <p id="pauseHint">P · resume &nbsp; R · restart &nbsp; T · menu</p></div>
<div id="banners"></div>
<div id="pops"></div>
<div id="stick" class="hidden"><i class="base"></i><i class="knob"></i></div>
<div id="aimStick" class="hidden"><i class="base"></i><i class="knob"></i></div>

      else if (e.type === 'boss') { o.model.position.y = 2.4 + Math.sin(time * 1.4) * 0.3; o.model.rotation.set(0, e.ang, Math.sin(time * 0.7) * 0.15); if (o.ringMesh) o.ringMesh.rotation.z = time * (2 + e.phase); }
      else { o.model.rotation.set(0, -e.ang - Math.PI / 2, 0); } }
    const fl = e.flash > 0 || (e.type === 'dasher' && e.state === 'aim' && e.timer < 0.2);
    if (e.type === 'boss' && e.charge > 0 && !fl) { tmpC.copy(o.baseGlow).multiplyScalar(1 + e.charge * 1.8 * (0.7 + 0.3 * Math.sin(time * 40))); for (const m of o.glows) m.color.copy(tmpC); }
    else for (const m of o.glows) m.color.copy(fl ? tmpC.setRGB(4, 4, 4) : o.baseGlow);
    if (o.aim) { const on = e.state === 'aim' && e.warp <= 0; o.aim.visible = on; if (on) { const k = 1 - e.timer / d.aimTime; o.aim.rotation.y = -e.dir - Math.PI / 2; o.aim.position.y = 0.05; o.aim.material.uniforms.uA.value = 0.3 + k * 0.9; o.aim.material.uniforms.uT.value = time; } }
  }
  // bullets
  let n = 0; for (const b of bullets) { if (b.life <= 0) continue; tmpV.set(b.vx, 0, b.vz).normalize();
    dummy.position.set(b.x, CONFIG.hover, b.z); dummy.quaternion.setFromUnitVectors(UP, tmpV); if (b.big) dummy.scale.set(2.2, 1.5, 2.2); else dummy.scale.set(1, 1, 1); dummy.updateMatrix();
    bulletMesh.setMatrixAt(n, dummy.matrix); bulletMesh.setColorAt(n, b.c); n++; }
  bulletMesh.count = n; bulletMesh.instanceMatrix.needsUpdate = true;
  n = 0; for (const s2 of eShots) { dummy.position.set(s2.x, CONFIG.hover, s2.z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.9 + Math.sin(time * 18 + s2.x) * 0.15); dummy.updateMatrix(); eShotMesh.setMatrixAt(n, dummy.matrix); eCoreMesh.setMatrixAt(n, dummy.matrix); n++; }
  eShotMesh.count = n; eShotMesh.instanceMatrix.needsUpdate = true; eCoreMesh.count = n; eCoreMesh.instanceMatrix.needsUpdate = true; if (bulletMesh.instanceColor) bulletMesh.instanceColor.needsUpdate = true;
  // sparks
  n = 0; for (const s of sparks) { if (s.life < CONFIG.sparkBlink && Math.floor(s.life * 12) % 2) continue;
    dummy.position.set(s.x, s.y + Math.sin(time * 5 + s.ang) * 0.1, s.z); dummy.rotation.set(0, s.ang, 0.4); dummy.scale.set(1, 1.4, 1); dummy.updateMatrix(); sparkMesh.setMatrixAt(n++, dummy.matrix); }
  sparkMesh.count = n; sparkMesh.instanceMatrix.needsUpdate = true;
  // power-ups
  for (const p of powerups) { const o = p.obj; o.position.set(p.x, 1.1 + Math.sin(time * 4) * 0.25, p.z); o.rotation.y = time * 1.5;
    o.userData.sh.position.y = -o.position.y + 0.04; o.userData.beam.position.y = -o.position.y; o.visible = !(p.life < 2 && Math.floor(p.life * 8) % 2); }

  // camera
  const fxMul = settings.fx === 'full' ? 1 : 0.3, tr = G.trauma * G.trauma * fxMul;
  G.trauma = Math.max(0, G.trauma - dt * 1.6); G.flash = Math.max(0, G.flash - dt / 0.15); G.flashCool -= dt; G.aberr = Math.max(0, G.aberr - dt / 0.2);
  G.multPulse = Math.max(0, G.multPulse - dt * 3); G.fovKick = Math.max(0, G.fovKick - dt * 2.5);
  // fit the arena width to the screen; portrait phones get a wider lens and a tighter follow instead of a far-away camera
  const baseFov = aspect < 1 ? 62 : 50, hHalf = Math.atan(Math.tan(THREE.MathUtils.degToRad(baseFov / 2)) * aspect);
  const fit = clamp(CONFIG.arenaR / Math.tan(hHalf) / 35 * (aspect < 1 ? 0.5 : 0.8), 1, 2.2), follow = aspect < 1 ? 0.75 : 0.32;
  if (playing || G.state === 'over') {
    const steep = aspect < 1, fx = player.x * follow, fz = player.z * (follow * 0.94);
    const H = (steep ? 33 : 31) * fit + (G.state === 'over' ? 6 : 0), Dz = (steep ? 11 : 17) * fit + (G.state === 'over' ? 6 : 0); // ~61° desktop, ~72° portrait
    wantPos.set(fx, H, fz + Dz); wantLook.set(fx, 0, fz - 1.5);
  } else { // title: low orbit, sun and mountains in view

  }
  const lk = Math.min(1, dt * (G.state === 'title' ? 1.2 : 3.2));
  camPos.lerp(wantPos, lk); camLook.lerp(wantLook, lk);
  camera.position.copy(camPos); camera.position.x += tr * rand(-0.9, 0.9); camera.position.y += tr * rand(-0.6, 0.6); camera.position.z += tr * rand(-0.6, 0.6);
  camera.lookAt(camLook); camera.rotation.z += -player.vx / CONFIG.playerSpeed * 0.02 * (playing ? 1 : 0) + tr * rand(-0.03, 0.03);
  const fov = baseFov + G.fovKick * 6 * fxMul; if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); updatePointScale(); }

  // post
  fxPass.uniforms.uTime.value = time; fxPass.uniforms.uAberr.value = settings.fx === 'full' ? G.aberr : 0; fxPass.uniforms.uFlash.value = G.flash * (settings.fx === 'full' ? 1 : 0.55);
  fxPass.uniforms.uScan.value = settings.fx === 'full' ? 1 : 0;
  bloomPass.strength = 0.7 + beat * 0.08;

  // title showcase + legend labels
  if (G.state === 'title' && showcase.length) {
    const step = aspect < 1 ? 2.9 : 3.8, legend = $('legend');
    const portrait = aspect < 0.9;
    showcase.forEach((s, i) => { const x = portrait ? ((i % 2) - 0.5) * 3.6 : (i - 1.5) * step, zz = camPos.z - (portrait ? 13 + Math.floor(i / 2) * 3 : 14 + Math.abs(i - 1.5) * 0.4);
      s.obj.root.position.set(x + camPos.x * 0.22, 0, zz);
      s.obj.model.position.y = (portrait ? 2.2 + Math.floor(i / 2) * 2.7 : 3.0) + Math.sin(time * 1.6 + i) * 0.18; s.obj.model.rotation.set(0.25, time * 0.9 + i, 0);
      if (s.obj.ringMesh) s.obj.ringMesh.rotation.z = time * 2; s.obj.root.visible = true;
      tmpV.set(s.obj.root.position.x, s.obj.model.position.y - 1.25, s.obj.root.position.z).project(camera);
      const el = legend.children[i]; el.style.left = ((tmpV.x * 0.5 + 0.5) * innerWidth) + 'px'; el.style.top = ((-tmpV.y * 0.5 + 0.5) * innerHeight) + 'px'; });
  } else showcase.forEach(s => s.obj.root.visible = false);
}

// =====================================================================
// LOOP
// =====================================================================
function resize() {
  const w = innerWidth, h = innerHeight; aspect = w / h;
  renderer.setPixelRatio(perf.pr); renderer.setSize(w, h, false); composer.setPixelRatio(perf.pr); composer.setSize(w, h);
  camera.aspect = aspect; camera.updateProjectionMatrix();
  updatePointScale(); fxPass.uniforms.uRes.value.set(w * perf.pr, h * perf.pr);
}
function updatePointScale() { const sc = innerHeight * perf.pr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))); pMat.uniforms.uScale.value = sc; emberMat.uniforms.uScale.value = sc; }
window.addEventListener('resize', resize);
let last = performance.now(), adaptT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 15.5) return; // cap at ~60 fps: 120 Hz phones would otherwise draw twice the frames and throttle
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; time += dt;
  perf.avg = lerp(perf.avg, dt * 1000, 0.05); adaptT += dt;
  if (adaptT > 2) { adaptT = 0; // adaptive resolution: protect the frame rate on weaker devices
    if (perf.avg > 22 && perf.pr > 0.75) { perf.pr = Math.max(0.75, perf.pr - 0.25); perf.quality = Math.max(0.5, perf.quality - 0.15); resize(); }
    else if (perf.avg < 15 && perf.pr < Math.min(window.devicePixelRatio || 1, 1.75)) { perf.pr = Math.min(perf.pr + 0.25, Math.min(window.devicePixelRatio || 1, 1.75)); perf.quality = Math.min(1, perf.quality + 0.1); resize(); } }
  step(dt); syncScene(dt);
  if (G.state === 'playing' || G.state === 'paused' || G.state === 'draft') updateHUD();
  else if (G.state === 'over') { const f = fmt(G.score * Math.min(1, (G.overT / 0.7) ** 0.6)); if (lastHud.final !== f) { $('final').textContent = f; lastHud.final = f; } }
  updatePopups(G.state === 'paused' ? 0 : dt); updateStick();
  composer.render(dt);
}

// =====================================================================
// BOOT
// =====================================================================
refreshButtons(); refreshHints(); resize();
function boot(models) {
  buildTemplates(models);
  const pl = TEMPL.player.clone(true); pl.scale.setScalar(1.45); playerBank.add(pl);
  const leg = $('legend');
  [['drifter', 'DRIFTER', 'wanders'], ['chaser', 'CHASER', 'hunts you'], ['splitter', 'SPLITTER', 'splits in 3'], ['dasher', 'DASHER', 'telegraphs · dashes']].forEach(([t, name, desc]) => {
    const obj = makeEnemyObject(t); obj.beam.visible = false; obj.model.scale.setScalar(ENEMY[t].r * 1.0); obj.root.visible = false; showcase.push({ t, obj });
    const el = document.createElement('div'); el.className = 'lg'; el.style.setProperty('--c', ENEMY[t].color); el.innerHTML = `<b>${name}</b><small>${desc} · ${ENEMY[t].score}</small>`; leg.appendChild(el);
  });
  // warm the pools so the first swarm never hitches
  for (const t of Object.keys(ENEMY)) for (let i = 0; i < (t === 'drifter' ? 24 : t === 'boss' ? 1 : 8); i++) releaseEnemyObject(t, makeEnemyObject(t));
  renderer.compile(scene, camera);
  G.state = 'title'; showScreen('title'); playerObj.visible = false; playerShadow.visible = false;
  const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 700);
}
const onModels = gltf => {
  const m = {}; gltf.scene.traverse(o => { if (['Player', 'Drifter', 'Chaser', 'Splitter', 'Dasher'].includes(o.name)) m[o.name] = o; });
  const fb = fallbackModels(); for (const k of Object.keys(fb)) if (!m[k]) m[k] = fb[k];
  boot(m);
}, onModelFail = err => { console.warn('GLB failed, using fallback geometry', err); boot(fallbackModels()); };
// hosts that cannot serve .glb (e.g. the published artifact) ship it as base64 in assets/pulsar-glb.js instead
if (window.PULSAR_GLB) { const bin = Uint8Array.from(atob(window.PULSAR_GLB), c => c.charCodeAt(0)); new GLTFLoader().parse(bin.buffer, '', onModels, onModelFail); }
else new GLTFLoader().load('assets/pulsar.glb', onModels, undefined, onModelFail);
requestAnimationFrame(loop);
window.PULSAR = { G, player, get enemies() { return enemies; }, startGame, spawnEnemy, CONFIG, settings, perf, camera, scene, dbg: { playerObj, trail, playerShadow, playerLight, points, bulletMesh, sparkMesh, debrisMesh } };
</script>
