<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010F">
<title>Pulsar 3D</title>
<link rel="preload" href="fonts/michroma-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/oxanium.woff2" as="font" type="font/woff2" crossorigin>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --bg: #05010F; --fg: #E8FFFF; --dim: rgba(232,255,255,.6); --cyan: #00F0FF; --pink: #FF2E88;
    --gold: #FFF35C; --mint: #4DFFC3; --violet: #B04CFF; --amber: #FFB000; --green: #7CFF4F; --red: #FF3B30;
    --panel: rgba(8,3,24,.72);
    /* type system: display / ui labels / body / numbers */
    --d: 'Michroma', 'Chakra Petch', system-ui, sans-serif; --u: 'Chakra Petch', system-ui, sans-serif;
    --b: 'Saira Semi Condensed', 'Chakra Petch', system-ui, sans-serif; --n: 'Oxanium', 'Chakra Petch', ui-monospace, monospace; --h: var(--u);
    /* motion tokens */
    --e-out: cubic-bezier(.16,1,.3,1); --e-in: cubic-bezier(.7,0,.84,0); --e-snap: cubic-bezier(.34,1.56,.64,1);
    --st: env(safe-area-inset-top, 0px); --sr: env(safe-area-inset-right, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #05010F; --fg: #E8FFFF; } }
  :root[data-theme="dark"] { --bg: #05010F; --fg: #E8FFFF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--b);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: var(--u); }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }
  .lbl { font: 600 12px var(--u); letter-spacing: .22em; color: var(--dim); text-transform: uppercase; }

  /* ---------- HUD ---------- */
  #hud { padding: calc(16px + var(--st)) calc(20px + var(--sr)) calc(18px + var(--sb)) calc(20px + var(--sl)); }
  .score-lbl { font: 600 12px var(--u); letter-spacing: .25em; color: var(--dim); }
  #score { font: 700 clamp(28px, 7vw, 44px)/1.05 var(--n); letter-spacing: .01em; text-shadow: 0 0 10px rgba(0,240,255,.7), 0 0 26px rgba(0,240,255,.3); }
  #sub { font: 600 12px var(--u); letter-spacing: .08em; color: var(--dim); margin-top: 2px; }
  #sub.best { color: var(--gold); }
  #multWrap { position: absolute; left: 50%; top: calc(10px + var(--st)); transform: translateX(-50%); text-align: center; }
  #mult { font: 800 clamp(36px, 9vw, 60px)/1 var(--n); color: var(--gold); text-shadow: 0 0 12px rgba(255,243,92,.85), 0 0 34px rgba(255,200,60,.45); transition: transform .08s; }
  #bar { display: flex; gap: 3px; justify-content: center; margin-top: 4px; width: 128px; margin-inline: auto; }
  #bar i { flex: 1; height: 4px; background: rgba(255,243,92,.16); transform: skewX(-20deg); }
  #bar i.on { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  #chain { font: 700 13px var(--u); color: var(--pink); margin-top: 8px; text-shadow: 0 0 8px var(--pink); letter-spacing: .16em; height: 18px; }
  #chainBar { height: 2px; background: var(--pink); margin: 2px auto 0; width: 0; box-shadow: 0 0 6px var(--pink); }
  #lives { position: absolute; right: calc(70px + var(--sr)); top: calc(22px + var(--st)); display: flex; gap: 6px; }
  #lives svg { width: 22px; height: 22px; filter: drop-shadow(0 0 5px var(--cyan)); }
  #powers { position: absolute; left: 50%; bottom: calc(26px + var(--sb)); transform: translateX(-50%); display: flex; gap: 18px; }
  .pw { width: 150px; font: 700 12px var(--u); letter-spacing: .16em; }
  .pw b { display: block; height: 4px; margin-top: 4px; background: rgba(255,255,255,.12); }
  .pw b s { display: block; height: 100%; background: currentColor; box-shadow: 0 0 8px currentColor; text-decoration: none; }
  #hint { position: absolute; left: 0; right: 0; top: 38%; text-align: center; transition: opacity .6s; padding: 0 16px; }
  #hint .a { font: 700 14px var(--u); letter-spacing: .12em; color: var(--fg); text-shadow: 0 0 8px rgba(0,240,255,.6); }
  #hint .b { font: 500 16px var(--b); color: var(--gold); margin-top: 6px; }
  #sector { position: absolute; left: calc(20px + var(--sl)); top: calc(92px + var(--st)); font: 600 12px var(--u); letter-spacing: .2em; color: var(--dim); }
  @media (max-width: 760px) {
    #multWrap { top: calc(70px + var(--st)); } .pw { width: 110px; }
    #sector { left: 0; right: 0; text-align: center; top: auto; bottom: calc(12px + var(--sb)); }
  }

  /* ---------- buttons ---------- */
  #btns { position: fixed; top: calc(14px + var(--st)); right: calc(16px + var(--sr)); display: flex; gap: 10px; pointer-events: auto; }
  .ib { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--cyan); background: rgba(5,1,15,.55); color: var(--fg);
    display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 0 10px rgba(0,240,255,.35), inset 0 0 8px rgba(0,240,255,.15); transition: transform .12s var(--e-out), box-shadow .2s; }
  .ib:hover { transform: scale(1.08); box-shadow: 0 0 16px rgba(0,240,255,.7), inset 0 0 10px rgba(0,240,255,.25); }
  .ib.off { border-color: rgba(232,255,255,.3); box-shadow: none; color: rgba(232,255,255,.45); }
  .ib svg { width: 18px; height: 18px; }
  body.ingame #bMusic, body.ingame #bSfx, body.ingame #bFx { display: none; } /* in a run, settings live in the pause screen */
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* ---------- overlays + screen motion ---------- */
  .ov { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  .ov.in > * { animation: rise .26s var(--e-out) backwards; animation-delay: calc(var(--i, 0) * 45ms + 60ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  #wipe { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan) 15%, #fff 50%, var(--pink) 85%, transparent);
    box-shadow: 0 0 12px var(--cyan), 0 0 30px rgba(0,240,255,.5); opacity: 0; pointer-events: none; z-index: 20; }
  #wipe.go { animation: wipe .38s var(--e-out); }
  @keyframes wipe { 0% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(100vh); } }

  /* ---------- title ---------- */
  #title { justify-content: flex-start; padding-top: calc(14vh + var(--st)); }
  .logo { position: relative; width: min(640px, 86vw); }
  .logo svg { display: block; width: 100%; height: auto; overflow: visible; }
  .logo .ltr { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: square; stroke-linejoin: miter; filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px var(--pink)) drop-shadow(0 0 30px rgba(255,46,136,.6));
    stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s var(--e-out) forwards; animation-delay: calc(var(--i) * 70ms); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .logo .beam { stroke: url(#beamG); stroke-width: 3.5; stroke-linecap: round; transform-origin: 464px 64px; transform: scaleX(0); animation: beam .3s var(--e-snap) .7s forwards; }
  .logo .beam.halo { stroke-width: 12; opacity: .35; }
  @keyframes beam { to { transform: scaleX(1); } }
  .logo .dot { fill: #fff; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px var(--cyan)); offset-path: path('M -40 64 H 650'); animation: travel 1.6s var(--e-in) 1.2s infinite; opacity: 0; }
  @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
  .logo sup { position: absolute; right: -1.7em; top: .1em; font: 800 clamp(14px, 3.4vw, 26px) var(--n); color: var(--cyan); text-shadow: 0 0 10px var(--cyan); letter-spacing: .04em; }
  .tag { font: 700 13px var(--u); letter-spacing: .5em; color: #E8FFFF; margin: 22px 0 0; text-shadow: 0 0 2px #05010F, 0 0 8px #05010F, 0 0 14px var(--cyan); padding-left: .5em; text-transform: uppercase; }
  #modes { display: flex; flex-direction: column; gap: 14px; margin-top: 6vh; pointer-events: auto; align-items: center; }
  .mode { width: min(320px, 82vw); padding: 14px 12px 12px; background: rgba(5,1,15,.55); border: 2px solid var(--c); color: var(--fg); cursor: pointer;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); box-shadow: inset 0 0 18px color-mix(in srgb, var(--c) 30%, transparent);
    transition: background .15s, transform .12s var(--e-out); font: inherit; }
  .mode:hover { background: color-mix(in srgb, var(--c) 18%, rgba(5,1,15,.6)); transform: translateY(-2px); }
  .mode b { display: block; font: 400 clamp(18px, 4vw, 22px) var(--d); letter-spacing: .14em; text-shadow: 0 0 10px var(--c); padding-left: .14em; }
  .mode small { display: block; margin-top: 4px; font: 600 12px var(--u); color: var(--c); letter-spacing: .12em; text-transform: uppercase; }
  #play { --c: var(--cyan); min-height: 72px; background: color-mix(in srgb, var(--cyan) 14%, rgba(5,1,15,.6)); animation: breathe 2.2s ease-in-out infinite; }
  #daily { --c: var(--pink); background: rgba(5,1,15,.66); }
  @keyframes breathe { 50% { box-shadow: inset 0 0 30px rgba(0,240,255,.45), 0 0 18px rgba(0,240,255,.35); } }
  #bestLine { margin-top: 18px; font: 700 15px var(--n); color: var(--gold); text-shadow: 0 0 8px rgba(255,243,92,.6); letter-spacing: .1em; min-height: 18px; }
  #legend { position: fixed; inset: 0; pointer-events: none; }
  .lg { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; }
  .lg b { font: 700 12px var(--u); letter-spacing: .2em; color: var(--c); text-shadow: 0 0 8px var(--c); }
  .lg small { display: block; font: 500 13px var(--b); color: var(--dim); }
  #controls { position: fixed; left: 0; right: 0; bottom: calc(14px + var(--sb)); text-align: center; font: 500 14px var(--b); color: var(--dim); padding: 0 12px; }
  @media (hover: none) { #controls { display: none; } }
  .kbd { display: inline-block; border: 1px solid rgba(232,255,255,.35); border-radius: 4px; padding: 0 5px; font: 700 12px var(--u); margin: 0 2px; }

  /* ---------- game over: the score is the headline ---------- */
  #over { background: radial-gradient(ellipse at center, rgba(5,1,15,.45), rgba(5,1,15,.88)); opacity: 0; transition: opacity .5s; }
  #over.show { opacity: 1; }
  .go { font: 700 13px var(--u); letter-spacing: .5em; color: var(--pink); text-shadow: 0 0 10px var(--pink); padding-left: .5em; }
  #killedBy { font: 700 13px var(--u); letter-spacing: .14em; color: var(--red); margin-top: 10px; text-transform: uppercase; text-shadow: 0 0 8px rgba(255,59,48,.5); }
  #quip { font: 500 16px var(--b); color: var(--dim); font-style: italic; margin-top: 4px; min-height: 20px; }
  #final { font: 800 clamp(64px, 17vw, 150px)/1 var(--n); margin-top: 10px; letter-spacing: -.01em; text-shadow: 0 0 14px rgba(0,240,255,.7), 0 0 50px rgba(0,240,255,.35); }
  #delta { font: 500 16px var(--b); color: var(--dim); min-height: 26px; margin-top: 4px; }
  #delta.nb { display: inline-block; font: 400 18px var(--d); letter-spacing: .14em; color: var(--gold); border: 2px solid var(--gold); padding: 6px 14px 5px 16px;
    text-shadow: 0 0 10px var(--gold); box-shadow: 0 0 18px rgba(255,243,92,.35), inset 0 0 12px rgba(255,243,92,.25); transform: rotate(-6deg); animation: stamp .45s var(--e-snap) .5s backwards; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-6deg) scale(2.2); } }
  #rank { font: 400 18px var(--d); color: var(--cyan); letter-spacing: .3em; margin-top: 12px; text-shadow: 0 0 10px var(--cyan); padding-left: .3em; }
  #stats { display: grid; grid-template-columns: repeat(5, minmax(64px, 112px)); gap: 6px; margin-top: 18px; padding: 12px 10px; background: var(--panel); border: 1px solid rgba(176,76,255,.35);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  #stats div small { display: block; font: 600 12px var(--u); letter-spacing: .2em; color: var(--dim); }
  #stats div b { font: 700 22px var(--n); }
  .menu { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  .mbtn { --c: var(--cyan); min-width: 150px; min-height: 48px; padding: 12px 18px; font: 700 15px var(--u); letter-spacing: .18em; color: var(--fg); cursor: pointer; text-transform: uppercase;
    background: color-mix(in srgb, var(--c) 12%, rgba(5,1,15,.7)); border: 2px solid var(--c); box-shadow: inset 0 0 16px color-mix(in srgb, var(--c) 28%, transparent);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition: background .15s, transform .12s var(--e-out); }
  .mbtn:hover, .mbtn:focus-visible { background: color-mix(in srgb, var(--c) 30%, rgba(5,1,15,.7)); transform: translateY(-2px); outline: none; }
  .mbtn.pri { min-width: min(320px, 82vw); min-height: 64px; font-size: 18px; background: color-mix(in srgb, var(--c) 18%, rgba(5,1,15,.7)); animation: breathe 2.2s ease-in-out infinite; }
  .mbtn.alt { --c: var(--pink); }
  .mbtn.dim { --c: rgba(232,255,255,.5); }
  .menu.col { flex-direction: column; align-items: center; }
  .menu .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .keys { font: 500 13px var(--b); color: rgba(232,255,255,.45); margin-top: 10px; }

  /* ---------- pause + settings ---------- */
  #pause { background: rgba(5,1,15,.8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #pause h2 { font: 400 clamp(32px, 8vw, 56px) var(--d); color: var(--cyan); margin: 0; text-shadow: 0 0 14px var(--cyan), 0 0 40px rgba(0,240,255,.6); letter-spacing: .16em; padding-left: .16em; }
  #pause p { font: 500 15px var(--b); color: var(--dim); }
  #toggles { display: grid; grid-template-columns: repeat(2, minmax(140px, 180px)); gap: 10px; margin-top: 18px; pointer-events: auto; }
  .tg { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; background: rgba(5,1,15,.6); color: var(--fg);
    border: 1px solid rgba(232,255,255,.25); font: 600 13px var(--u); letter-spacing: .14em; cursor: pointer; text-transform: uppercase; }
  .tg b { font: 700 13px var(--u); color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .tg.off b { color: rgba(232,255,255,.45); text-shadow: none; }

  /* ---------- banners: one shape per meaning ---------- */
  #banners { position: fixed; left: 0; right: 0; top: 30%; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
  .bn { position: relative; font: 400 clamp(24px, 6vw, 48px) var(--d); letter-spacing: .12em; padding-left: .12em; color: var(--c); text-shadow: 0 0 10px var(--c), 0 0 34px var(--c); text-align: center;
    animation: bnInfo var(--d, 1.8s) var(--e-out) forwards; }
  .bn small { display: block; font: 500 16px var(--b); color: var(--fg); letter-spacing: .04em; text-shadow: none; opacity: .88; margin-top: 4px; }
  @keyframes bnInfo { 0% { opacity: 0; transform: translateX(-16px); } 12% { opacity: 1; transform: none; } 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(16px); } }
  .bn.reward { animation-name: bnReward; }
  .bn.reward::before { content: ''; position: absolute; left: 50%; top: 50%; width: 1.4em; height: 1.4em; border: 2px solid var(--c); border-radius: 50%; transform: translate(-50%, -50%) scale(.2); opacity: 0;
    animation: ring .6s var(--e-out); box-shadow: 0 0 14px var(--c); }
  @keyframes bnReward { 0% { opacity: 0; transform: scale(1.4); } 16% { opacity: 1; transform: scale(1); } 85% { opacity: 1; transform: scale(1.03); } 100% { opacity: 0; transform: scale(1.05); } }
  @keyframes ring { 0% { opacity: .9; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(4); } }
  .bn.threat { color: var(--pink); padding: 10px 0; width: 100%; animation-name: bnThreat; }
  .bn.threat::before, .bn.threat::after { content: ''; position: absolute; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--pink) 0 8px, transparent 8px 16px); opacity: .8; }
  .bn.threat::before { top: -4px; } .bn.threat::after { bottom: -4px; }
  @keyframes bnThreat { 0% { opacity: 0; } 6% { opacity: 1; } 20% { opacity: .35; } 32% { opacity: 1; } 44% { opacity: .35; } 56% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
  .bn.damage { color: var(--red); animation-name: bnDamage; }
  @keyframes bnDamage { 0% { opacity: 0; transform: translateX(0); } 5% { opacity: 1; transform: translateX(-6px); } 10% { transform: translateX(6px); } 15% { transform: translateX(-6px); } 20% { transform: translateX(6px); } 25% { transform: none; } 85% { opacity: 1; } 100% { opacity: 0; } }
  #pops { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .pp { position: absolute; left: 0; top: 0; font: 700 16px var(--n); white-space: nowrap; will-change: transform, opacity; text-shadow: 0 0 8px currentColor; }

  /* ---------- touch ---------- */
  #stick, #aimStick { position: fixed; left: 0; top: 0; pointer-events: none; }
  #stick i, #aimStick i { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  body.touch #dash { display: none; } body.touch #powers { bottom: calc(140px + var(--sb)); }
  #aimStick .base { width: 110px; height: 110px; border: 2px solid rgba(255,46,136,.5); box-shadow: 0 0 14px rgba(255,46,136,.3), inset 0 0 14px rgba(255,46,136,.2); }
  #aimStick .knob { width: 46px; height: 46px; background: rgba(255,46,136,.25); border: 2px solid rgba(255,220,240,.7); box-shadow: 0 0 12px rgba(255,46,136,.6); }
  #stick .base { width: 110px; height: 110px; border: 2px solid rgba(0,240,255,.4); box-shadow: 0 0 14px rgba(0,240,255,.25), inset 0 0 14px rgba(0,240,255,.2); }
  #stick .knob { width: 46px; height: 46px; background: rgba(0,240,255,.22); border: 2px solid rgba(232,255,255,.6); box-shadow: 0 0 12px rgba(0,240,255,.5); }
  #loading { background: var(--bg); font: 600 13px var(--u); letter-spacing: .5em; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); transition: opacity .6s; }

  /* ---------- boss, dash ---------- */
  #bossWrap { position: absolute; left: 50%; top: calc(112px + var(--st)); transform: translateX(-50%); width: min(520px, 64vw); text-align: center; }
  #bossName { font: 700 13px var(--u); letter-spacing: .32em; color: var(--pink); text-shadow: 0 0 8px var(--pink); }
  #bossHp { height: 6px; margin-top: 5px; background: rgba(255,46,136,.14); border: 1px solid rgba(255,46,136,.55); transform: skewX(-20deg); }
  #bossHp i { display: block; height: 100%; width: 100%; background: var(--pink); box-shadow: 0 0 10px var(--pink); transition: width .15s; }
  #dash { position: absolute; left: calc(20px + var(--sl)); bottom: calc(24px + var(--sb)); font: 700 12px var(--u); letter-spacing: .2em; color: var(--dim); }
  #dash.ready { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  #dash b { display: block; width: 120px; height: 4px; margin-top: 5px; background: rgba(0,240,255,.14); transform: skewX(-20deg); }
  #dash b s { display: block; height: 100%; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); text-decoration: none; }
  #dashBtn { position: fixed; right: calc(24px + var(--sr)); bottom: calc(32px + var(--sb)); width: 88px; height: 88px; border-radius: 50%; border: 2px solid var(--cyan);
    background: rgba(0,240,255,.12); color: var(--fg); font: 700 14px var(--u); letter-spacing: .14em; pointer-events: auto; box-shadow: 0 0 16px rgba(0,240,255,.45), inset 0 0 14px rgba(0,240,255,.25); touch-action: none; }
  #dashBtn.cool { opacity: .35; box-shadow: none; }

  /* ---------- upgrade cards ---------- */
  #draft { background: rgba(7,5,26,.92); pointer-events: auto; }
  #draft h3 { font: 400 clamp(20px, 4.4vw, 32px) var(--d); letter-spacing: .14em; color: var(--gold); text-shadow: 0 0 14px var(--gold); margin: 0 0 8px; text-wrap: balance; }
  #draft p { font: 500 15px var(--b); color: var(--dim); margin: 0 0 22px; }
  #cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 780px; }
  .card { --c: var(--cyan); position: relative; width: min(224px, 44vw); min-height: 230px; padding: 16px 14px 14px; color: var(--fg); cursor: pointer; text-align: left; font: inherit;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 16%, rgba(8,3,24,.95)), rgba(8,3,24,.95)); border: 2px solid var(--c);
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
    box-shadow: inset 0 0 26px color-mix(in srgb, var(--c) 26%, transparent); display: flex; flex-direction: column; gap: 8px;
    transition: transform .14s var(--e-out), box-shadow .2s, opacity .2s; animation: deal .36s var(--e-out) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
  .card .gl { width: 44px; height: 44px; color: var(--c); filter: drop-shadow(0 0 6px var(--c)); }

  const X = { K, oc, out, rv: rvIn, dl: K.pingpong(beat * 0.75, 0.38, K.gain(0.35, out)), hatBus: K.pan(0.2, out), beat, bar, s16: beat / 4, M };

    for (let i = 0; i < loopN; i++) sq += d[i] * d[i]; return d; });

  chans.forEach((d, ch) => { for (let i = 0; i < loopN; i++) d[i] *= k; res.copyToChannel(d, ch); });

// LOOP
// =====================================================================
function resize() {

}

  else if (G.state === 'over') { const f = fmt(G.score * Math.min(1, (G.overT / 0.7) ** 0.6)); if (lastHud.final !== f) { $('final').textContent = f; lastHud.final = f; } }
  updatePopups(G.state === 'paused' ? 0 : dt); updateStick();

// =====================================================================
// BOOT
// =====================================================================
refreshButtons(); refreshHints(); resize();
function boot(models) {

  const pl = TEMPL.player.clone(true); pl.scale.setScalar(1.45); playerBank.add(pl);
  const leg = $('legend');
  [['drifter', 'DRIFTER', 'wanders'], ['chaser', 'CHASER', 'hunts you'], ['splitter', 'SPLITTER', 'splits in 3'], ['dasher', 'DASHER', 'telegraphs · dashes']].forEach(([t, name, desc]) => {
    const obj = makeEnemyObject(t); obj.beam.visible = false; obj.model.scale.setScalar(ENEMY[t].r * 1.0); obj.root.visible = false; showcase.push({ t, obj });
    const el = document.createElement('div'); el.className = 'lg'; el.style.setProperty('--c', ENEMY[t].color); el.innerHTML = `<b>${name}</b><small>${desc} · ${ENEMY[t].score}</small>`; leg.appendChild(el);
  });

}
const onModels = gltf => {
