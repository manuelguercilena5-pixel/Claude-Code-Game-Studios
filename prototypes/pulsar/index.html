<script>
'use strict';
/* =====================================================================
   PULSAR — neon arena shooter. Single file, procedural art + audio.
   Design: game-designer brief · Art: art-director brief ·
   Audio: audio-director brief · Market fixes: producer + market research.
   ===================================================================== */

// ---------- Tuning (all gameplay values live here) ----------
const CONFIG = {
  playerSpeed: 310, playerAccel: 16, playerRadius: 14, hitbox: 6,
  fireRate: 8, bulletSpeed: 980, bulletLife: 0.95,
  sparkLife: 3.0, sparkBlink: 1.0, magnetRadius: 75, collectRadius: 24,
  sparksPerMult: 8, multCap: 20, hitMultPenalty: 0.5,
  chainWindow: 1.0, chainBonusEvery: 10, grazeRadius: 24, grazePoints: 10,
  baseSpawn: 0.8, spawnRamp: 0.035, spawnCap: 5.0, speedRampMax: 0.4, speedRampTime: 300,
  waveInterval: 30, wavePause: 3, maxEnemies: 170, spawnWarp: 0.5, spawnSafeDist: 270,
  powerChance: 0.05, powerMinGap: 14, powerFieldLife: 8, powerDuration: 8, shieldDuration: 15,
  lives: 3, maxLives: 5, extraLifeEvery: 50000, respawnInvuln: 1.6, clearRadius: 200,
  restartLock: 0.8, arenaMargin: 16,
};
const ENEMY = {
  drifter:  { r: 15, speed: 90,  hp: 1, score: 50,  color: '#B04CFF', ci: 1 },
  chaser:   { r: 14, speed: 170, hp: 1, score: 100, color: '#FF2E88', ci: 2 },
  splitter: { r: 19, speed: 70,  hp: 3, score: 150, color: '#7CFF4F', ci: 3 },
  mini:     { r: 9,  speed: 220, hp: 1, score: 25,  color: '#7CFF4F', ci: 3 },
  dasher:   { r: 16, speed: 60,  hp: 2, score: 200, color: '#FFB000', ci: 4,
              dashSpeed: 640, dashDist: 500, aimTime: 0.6, restTime: 1.2 },
};
// Particle palette (index → colour). The player is the only cool cyan object.
const PCOL = ['#00F0FF', '#B04CFF', '#FF2E88', '#7CFF4F', '#FFB000', '#FFF35C', '#4DFFC3', '#FFFFFF', '#FF3B30'];
const C = { bg: '#05010F', player: '#00F0FF', core: '#E8FFFF', spark: '#FFF35C', power: '#4DFFC3',
  ui: '#E8FFFF', accent: '#00F0FF', warn: '#FF2E88', danger: '#FF3B30', grid: '122,60,255' };
const POWER = {
  spread:    { label: 'SPREAD',    color: '#4DFFC3' },
  overdrive: { label: 'OVERDRIVE', color: '#FFF35C' },
  shield:    { label: 'SHIELD',    color: '#00F0FF' },
};
const FONT_T = "'Monoton', 'Orbitron', sans-serif";
const FONT_H = "'Orbitron', 'Rajdhani', system-ui, sans-serif";
const FONT_B = "'Rajdhani', 'Orbitron', system-ui, sans-serif";

// ---------- Storage (never trusted to exist) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const settings = Object.assign({ music: true, sfx: true, fx: reduceMotion ? 'calm' : 'full' }, store.get('pulsar_settings', {}));
let best = Object.assign({ score: 0, mult: 1, chain: 0, time: 0 }, store.get('pulsar_best', {}));
let dailyBest = store.get('pulsar_daily', { day: '', score: 0 });
let ghostBest = store.get('pulsar_ghost', null); // { arcade: [x,y,...] } normalised coords at 10 Hz
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

// ---------- RNG: seeded for gameplay (daily mode), Math.random for cosmetics ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
let rng = Math.random, dropRng = Math.random;
const rand = (a, b) => a + Math.random() * (b - a);
const grand = (a, b) => a + rng() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const fmt = n => Math.floor(n).toLocaleString('en-US');
const fmtTime = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// =====================================================================
// AUDIO — everything synthesised live (audio-director recipes)
// =====================================================================
const Sound = {
  ctx: null, ready: false, lastShot: 0, voices: 0, step: 0, nextTime: 0, timer: null,
  musicMode: 'title', level: 0, startTime: 0, BPM: 104,
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 6; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
    const lim = c.createDynamicsCompressor();
    lim.threshold.value = -2; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.05;
    this.master = c.createGain(); this.master.gain.value = 0.85;
    comp.connect(lim); lim.connect(this.master); this.master.connect(c.destination);
    this.bus = comp;
    this.sfx = c.createGain(); this.sfx.gain.value = settings.sfx ? 0.8 : 0; this.sfx.connect(comp);
    // music: pump (sidechain fake) → duck → filter → music gain → comp ; kick bypasses pump
    this.musicGain = c.createGain(); this.musicGain.gain.value = settings.music ? 0.5 : 0;
    this.musicFilter = c.createBiquadFilter(); this.musicFilter.type = 'lowpass'; this.musicFilter.frequency.value = 1600; this.musicFilter.Q.value = 0.7;
    this.duck = c.createGain(); this.pump = c.createGain(); this.kickBus = c.createGain();
    this.pump.connect(this.duck); this.kickBus.connect(this.duck); this.duck.connect(this.musicFilter);
    this.musicFilter.connect(this.musicGain); this.musicGain.connect(comp);
    // feedback delay (dotted 8th)
    this.delay = c.createDelay(1.5); this.delay.delayTime.value = 60 / this.BPM * 0.75;
    const fb = c.createGain(); fb.gain.value = 0.35; const dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2500;
    this.delay.connect(dlp); dlp.connect(fb); fb.connect(this.delay);
    this.delayMusic = c.createGain(); this.delayMusic.connect(this.delay); dlp.connect(this.duck);
    this.delaySfx = c.createGain(); this.delaySfx.connect(this.delay);
    // generated-IR reverb
    const len = c.sampleRate * 2, ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    this.reverb = c.createConvolver(); this.reverb.buffer = ir;
    const rvOut = c.createGain(); rvOut.gain.value = 0.18; this.reverb.connect(rvOut); rvOut.connect(comp);
    // shared 1s noise buffer
    this.noise = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const nd = this.noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    // iOS unlock: 1-sample silent buffer
    const sb = c.createBufferSource(); sb.buffer = c.createBuffer(1, 1, 22050); sb.connect(c.destination); sb.start(0);
    this.ready = true;
    this.nextTime = c.currentTime + 0.08; this.startTime = this.nextTime; this.step = 0;
    this.timer = setInterval(() => this.schedule(), 25);
    this.setMode(this.musicMode, true);
  },
  get now() { return this.ctx ? this.ctx.currentTime : 0; },
  applySettings() {
    if (!this.ready) return; const t = this.now;
    this.sfx.gain.setTargetAtTime(settings.sfx ? 0.8 : 0, t, 0.03);
    this.musicGain.gain.setTargetAtTime(settings.music ? 0.5 : 0, t, 0.05);
  },
  setMode(mode, instant) {
    this.musicMode = mode; if (!this.ready) return;
    const f = this.musicFilter.frequency, t = this.now;
    f.cancelScheduledValues(t); f.setValueAtTime(f.value, t);
    const target = mode === 'game' ? 18000 : mode === 'title' ? 1600 : 380;
    f.exponentialRampToValueAtTime(target, t + (instant ? 0.05 : mode === 'over' ? 1.0 : 0.6));
  },
  env(g, t, a, d, peak) {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  },
  // generic oscillator voice
  tone(o) {
    const c = this.ctx, t = o.t != null ? o.t : c.currentTime;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + (o.sweep || o.d));
    if (o.detune) osc.detune.value = o.detune;
    let head = osc;
    if (o.filter) { const fl = c.createBiquadFilter(); fl.type = o.filter.type; fl.frequency.value = o.filter.f; fl.Q.value = o.filter.q || 1;
      if (o.filter.f1) { fl.frequency.setValueAtTime(o.filter.f, t); fl.frequency.exponentialRampToValueAtTime(o.filter.f1, t + (o.filter.sweep || o.d)); }
      osc.connect(fl); head = fl; }
    if (o.shape) { head.connect(o.shape); head = o.shape; }
    head.connect(g); this.env(g, t, o.a || 0.002, o.d, o.peak);
    g.connect(o.dest || this.sfx);
    if (o.delay) { const s = this.ctx.createGain(); s.gain.value = o.delay; g.connect(s); s.connect(o.dest === this.pump ? this.delayMusic : this.delaySfx); }
    if (o.rev) { const s = this.ctx.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.reverb); }
    osc.start(t); osc.stop(t + (o.a || 0.002) + o.d + 0.05);
    this.voices++; osc.onended = () => { this.voices--; osc.disconnect(); g.disconnect(); };
    return osc;
  },
  noiseHit(o) {
    const c = this.ctx, t = o.t != null ? o.t : c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noise;
    const fl = c.createBiquadFilter(); fl.type = o.ft || 'lowpass'; fl.Q.value = o.q || 1; fl.frequency.setValueAtTime(o.f0, t);
    if (o.f1) fl.frequency.exponentialRampToValueAtTime(o.f1, t + (o.sweep || o.d));
    const g = c.createGain(); src.connect(fl); let head = fl;
    if (o.shape) { fl.connect(o.shape); head = o.shape; }
    head.connect(g); this.env(g, t, o.a || 0.001, o.d, o.peak); g.connect(o.dest || this.sfx);
    if (o.rev) { const s = c.createGain(); s.gain.value = o.rev; g.connect(s); s.connect(this.reverb); }
    src.start(t, Math.random() * 0.5); src.stop(t + (o.a || 0.001) + o.d + 0.05);
    this.voices++; src.onended = () => { this.voices--; src.disconnect(); g.disconnect(); };
  },
  softClip(k) { const n = 256, curve = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
    const ws = this.ctx.createWaveShaper(); ws.curve = curve; return ws; },
  duckMusic(db, dur) { if (!this.ready) return; const t = this.now, g = this.duck.gain; const v = Math.pow(10, -db / 20);
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + 0.02); g.linearRampToValueAtTime(1, t + dur); },
  ok(prio) { return this.ready && settings.sfx && (this.voices < 46 || prio); },
  // ---- SFX ----
  shot() { if (!this.ok()) return; const t = this.now; if (t - this.lastShot < 0.045) return; this.lastShot = t;
    this.tone({ type: 'square', f0: 880, f1: 220, d: 0.09, sweep: 0.08, peak: 0.07, detune: rand(-80, 80), filter: { type: 'lowpass', f: 3000 } }); },
  hit() { if (!this.ok()) return;
    this.tone({ type: 'triangle', f0: 600, f1: 300, d: 0.05, peak: 0.16 });
    this.noiseHit({ ft: 'bandpass', f0: 2500, q: 3, d: 0.03, peak: 0.12 }); },
  explode(big) { if (!this.ok(big)) return;
    if (!big) { this.noiseHit({ f0: 3000, f1: 200, sweep: 0.25, q: 2, d: 0.3, peak: 0.28 });
      this.tone({ type: 'sine', f0: 120, f1: 40, d: 0.3, peak: 0.25 }); return; }
    this.noiseHit({ f0: 5000, f1: 80, sweep: 0.9, q: 2, d: 1.0, peak: 0.45, shape: this.softClip(20), rev: 0.4 });
    this.tone({ type: 'sine', f0: 60, f1: 30, d: 1.0, peak: 0.5 }); this.duckMusic(6, 0.3); },
  spawn(type) { if (!this.ok()) return; const f = { drifter: 330, chaser: 520, splitter: 260, dasher: 700 }[type] || 400;
    this.tone({ type: 'sine', f0: f * 0.5, f1: f, d: 0.16, a: 0.03, peak: 0.035, delay: 0.2 }); },
  spark(n) { if (!this.ok()) return; const f = 1400 * Math.pow(2, (n % CONFIG.sparksPerMult) / 12);
    this.tone({ type: 'sine', f0: f, f1: f * 1.5, d: 0.06, peak: 0.05 }); },
  pickup() { if (!this.ok(true)) return; const t = this.now; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
    this.tone({ type: 'square', f0: f, d: 0.08, peak: 0.1, t: t + i * 0.05, delay: 0.25, filter: { type: 'lowpass', f: 4000 } })); },
  hurt() { if (!this.ready || !settings.sfx) return; const c = this.ctx, t = c.currentTime;
    const osc = c.createOscillator(), fl = c.createBiquadFilter(), g = c.createGain(), lfo = c.createOscillator(), lg = c.createGain(), gate = c.createGain();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.25);
    fl.type = 'lowpass'; fl.frequency.value = 1200; lfo.type = 'square'; lfo.frequency.value = 30; lg.gain.value = 0.5; gate.gain.value = 0.5;
    lfo.connect(lg); lg.connect(gate.gain); osc.connect(fl); fl.connect(gate); gate.connect(g); g.connect(this.sfx);
    this.env(g, t, 0.003, 0.32, 0.45); osc.start(t); lfo.start(t); osc.stop(t + 0.4); lfo.stop(t + 0.4);
    osc.onended = () => { osc.disconnect(); g.disconnect(); lfo.disconnect(); };
    this.noiseHit({ f0: 2000, f1: 100, d: 0.4, peak: 0.3 }); this.duckMusic(9, 0.4); },
  multUp(m) { if (!this.ok(true)) return; const f = 440 * Math.pow(2, (m - 1) / 12);
    this.tone({ type: 'sawtooth', f0: f, d: 0.16, a: 0.005, peak: 0.07, detune: 7, delay: 0.3, filter: { type: 'lowpass', f: 3500 } });
    this.tone({ type: 'sawtooth', f0: f * 1.5, d: 0.16, a: 0.005, peak: 0.05, detune: -7, delay: 0.3, filter: { type: 'lowpass', f: 3500 } }); },
  graze() { if (!this.ok()) return; this.noiseHit({ ft: 'bandpass', f0: 1200, f1: 5000, q: 4, d: 0.12, a: 0.03, peak: 0.1 });
    this.tone({ type: 'sine', f0: 1760, d: 0.08, peak: 0.04 }); },
  chain(n) { if (!this.ok(true)) return; const t = this.now;
    [0, 4, 7, 12, 16].forEach((s, i) => this.tone({ type: 'triangle', f0: 523.25 * Math.pow(2, s / 12), d: 0.12, peak: 0.08, t: t + i * 0.04, delay: 0.3 })); },
  life() { if (!this.ok(true)) return; const t = this.now;
    [0, 7, 12, 19, 24].forEach((s, i) => this.tone({ type: 'square', f0: 392 * Math.pow(2, s / 12), d: 0.18, peak: 0.08, t: t + i * 0.07, delay: 0.3, filter: { type: 'lowpass', f: 3000 } })); },
  alarm() { if (!this.ok(true)) return; const t = this.now;
    for (let i = 0; i < 3; i++) this.tone({ type: 'sawtooth', f0: 220, f1: 440, d: 0.16, a: 0.01, peak: 0.07, t: t + i * 0.2, filter: { type: 'lowpass', f: 1800 } }); },
  dashCharge() { if (!this.ok()) return; this.tone({ type: 'sawtooth', f0: 120, f1: 520, d: 0.55, a: 0.05, peak: 0.04, filter: { type: 'lowpass', f: 1500 } }); },
  shieldBreak() { if (!this.ok(true)) return; this.tone({ type: 'triangle', f0: 1800, f1: 200, d: 0.35, peak: 0.18, rev: 0.4 });
    this.noiseHit({ ft: 'highpass', f0: 3000, d: 0.2, peak: 0.15 }); },
  gameOver() { if (!this.ready || !settings.sfx) return;
    this.tone({ type: 'sawtooth', f0: 220, f1: 55, d: 2.0, sweep: 1.5, peak: 0.25, filter: { type: 'lowpass', f: 2000, f1: 150, sweep: 1.5 }, rev: 0.7 }); },
  click() { if (!this.ready || !settings.sfx) return; this.tone({ type: 'sine', f0: 1200, d: 0.03, a: 0.001, peak: 0.1 }); },
  // ---- Music: lookahead scheduler, Am–F–C–G ----
  schedule() {
    if (!this.ready || this.ctx.state !== 'running') return;
    const stepDur = 60 / this.BPM / 4;
    if (this.nextTime < this.ctx.currentTime - 0.2) this.nextTime = this.ctx.currentTime + 0.05; // recovered from suspension
    while (this.nextTime < this.ctx.currentTime + 0.12) { this.playStep(this.step, this.nextTime); this.nextTime += stepDur; this.step = (this.step + 1) % 64; }
  },
  playStep(step, t) {
    if (!settings.music) return;
    const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]], BASS = [33, 29, 36, 31];
    const bar = (step >> 4) & 3, s = step & 15, ch = CH[bar], mode = this.musicMode, lvl = mode === 'game' ? this.level : 1;
    const mf = m => 440 * Math.pow(2, (m - 69) / 12);
    if (s === 0) ch.forEach(m => { // pad
      [-10, 10].forEach(dt => this.tone({ type: 'sawtooth', f0: mf(m), detune: dt, a: 0.3, d: 2.1, peak: 0.028, dest: this.pump, filter: { type: 'lowpass', f: 1500 }, rev: 0.5 })); });
    const kickOn = mode === 'game' ? (s % 4 === 0) : (s === 0 || s === 8);
    if (kickOn) { // kick + pump
      const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
      o.connect(g); g.connect(this.kickBus); this.env(g, t, 0.002, 0.3, mode === 'game' ? 0.6 : 0.35); o.start(t); o.stop(t + 0.35);
      o.onended = () => { o.disconnect(); g.disconnect(); };
      const p = this.pump.gain; p.setValueAtTime(0.45, t); p.linearRampToValueAtTime(1, t + 0.18);
    }
    if (mode === 'game' && (s === 4 || s === 12)) { // snare
      this.noiseHit({ t, ft: 'highpass', f0: 1000, d: 0.15, peak: 0.16, dest: this.pump, rev: 0.3 });
      this.tone({ t, type: 'triangle', f0: 180, d: 0.08, peak: 0.12, dest: this.pump });
    }
    if ((mode === 'game' && lvl >= 1) && s % 2 === 0) this.noiseHit({ t, ft: 'highpass', f0: 7000, d: 0.03, peak: s % 4 === 2 ? 0.07 : 0.04, dest: this.pump });
    if (s % 2 === 0) { // bass 8ths with filter envelope
      const c = this.ctx, o = c.createOscillator(), fl = c.createBiquadFilter(), g = c.createGain();
      const m = BASS[bar] + (s % 4 === 2 && lvl >= 2 ? 12 : 0);
      o.type = 'sawtooth'; o.frequency.value = mf(m); fl.type = 'lowpass'; fl.Q.value = 4;
      fl.frequency.setValueAtTime(380, t); fl.frequency.linearRampToValueAtTime(1100, t + 0.005); fl.frequency.exponentialRampToValueAtTime(300, t + 0.12);
      o.connect(fl); fl.connect(g); g.connect(this.pump); this.env(g, t, 0.004, 0.2, mode === 'game' ? 0.16 : 0.1); o.start(t); o.stop(t + 0.26);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    }
    if (mode !== 'game' || lvl >= 2) { // arpeggio
      const arp = [ch[0], ch[2], ch[0] + 12, ch[1]], m = arp[s % 4] + (mode === 'game' && lvl >= 3 && s >= 8 ? 24 : 12);
      this.tone({ t, type: 'square', f0: mf(m), d: 0.1, peak: mode === 'game' ? 0.035 : 0.025, dest: this.pump, delay: 0.35, filter: { type: 'lowpass', f: 3200 } });
    }

function nearestEnemy(x, y) { let b = null, bd = 1e9; for (const e of enemies) { if (e.dead || e.warp > 0) continue;
  const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd) { bd = d; b = e; } } return b; }

function updatePlayer(dt) {

  }

function updateEnemies(dt) {

  const px = player.x, py = player.y, M = CONFIG.arenaMargin;

      else if (e.state === 'aim') { e.vx *= 0.85; e.vy *= 0.85; if (e.timer > 0.25) { e.dir = Math.atan2(uy, ux); } e.ang = e.dir;
        e.timer -= dt; if (e.timer <= 0) { e.state = 'dash'; e.dashLeft = d.dashDist; gridImpulse(e.x, e.y, 6, 120); } }

  if (G.hitstop > 0) { G.hitstop -= realDt; updateFx(realDt * 0.3); return; }
  if (G.slowmo > 0) { G.slowmo -= realDt; dt *= 0.28; if (G.slowmo <= 0) { endGame(); } }
  G.t += dt;
  if (!player.dead) updatePlayer(dt);
  if (!player.dead) updateSpawning(dt);

}

function drawWorld(time, pulse) {
  // arena border with corner brackets
  const M = CONFIG.arenaMargin;
  ctx.strokeStyle = `rgba(176,76,255,${0.45 + pulse * 0.35})`; ctx.lineWidth = 2; ctx.strokeRect(M, M, W - 2 * M, H - 2 * M);
  ctx.strokeStyle = C.player; ctx.lineWidth = 3; ctx.globalAlpha = 0.7 + pulse * 0.3; const L = 34;
  ctx.beginPath();
  [[M, M, 1, 1], [W - M, M, -1, 1], [M, H - M, 1, -1], [W - M, H - M, -1, -1]].forEach(([x, y, sx, sy]) => { ctx.moveTo(x + sx * L, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * L); });
  ctx.stroke(); ctx.globalAlpha = 1;

  // ghost of best run
  if (G.ghostPlay && G.state === 'playing') { const i = Math.min(Math.floor(G.t * 10), G.ghostPlay.length / 2 - 1) * 2;
    if (i >= 0 && G.t * 10 < G.ghostPlay.length / 2) { const gx = G.ghostPlay[i] * W, gy = G.ghostPlay[i + 1] * H;
      glowShape(SH.player, gx, gy, -Math.PI / 2, 12, '#9AF7FF', { alpha: 0.18, fill: 0.05, lw: 1.5 }); txt('BEST', gx, gy + 22, 9, '#9AF7FF', FONT_H, 700, 'center', 0, 0.3); } }

  // sparks
  for (const s of sparks) { if (s.life < CONFIG.sparkBlink && Math.floor(s.life * 12) % 2) continue;
    glowShape(SH.spark, s.x, s.y, s.ang, 6, C.spark, { fill: 0.5, lw: 2 }); }
  // power-ups
  for (const p of powerups) { if (p.life < 2 && Math.floor(p.life * 8) % 2) continue;
    const col = POWER[p.type].color, bob = Math.sin(time * TAU * 2) * 4, pu = 1 + Math.sin(time * 6) * 0.08;
    glowShape(SH.hex, p.x, p.y + bob, p.ang, 17 * pu, col, { fill: 0.22, lw: 3 });
    ctx.save(); ctx.translate(p.x, p.y + bob); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.beginPath();
    if (p.type === 'spread') { for (let k = -1; k <= 1; k++) { ctx.moveTo(-6, 0); ctx.lineTo(7, k * 6); } }
    else if (p.type === 'overdrive') { ctx.moveTo(-7, -6); ctx.lineTo(-1, 0); ctx.lineTo(-7, 6); ctx.moveTo(0, -6); ctx.lineTo(6, 0); ctx.lineTo(0, 6); }
    else { ctx.arc(0, 0, 7, 0, TAU); }
    ctx.stroke(); ctx.restore();
    txt(POWER[p.type].label, p.x, p.y + bob + 30, 10, col, FONT_H, 700, 'center', 0, 0.85); }

  // bullets with ghost trails
  ctx.lineCap = 'round'; ctx.globalCompositeOperation = 'lighter';
  for (let pass = 0; pass < 2; pass++) for (let c = 0; c < PCOL.length; c++) {
    let any = false;
    for (const b of bullets) { if (b.c !== c) continue; if (!any) { ctx.beginPath(); any = true; }
      const L = pass ? 0.012 : 0.03; ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * L, b.y - b.vy * L); }
    if (any) { ctx.strokeStyle = pass ? '#FFFFFF' : PCOL[c]; ctx.lineWidth = pass ? 1.6 : 4; ctx.globalAlpha = pass ? 0.9 : 0.75; ctx.stroke(); }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // particles (under enemies so threats always read)

  // rings
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) { const k = 1 - r.life / r.max, rad = r.maxR * (1 - Math.pow(1 - k, 3));
    ctx.globalAlpha = (1 - k) * 0.9; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * (1 - k * 0.6); ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, TAU); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  // enemies
  for (const e of enemies) {
    const d = ENEMY[e.type];
    if (e.warp > 0) { const k = e.warp / e.warpMax; // spinning warp-in, 3x → 1x
      glowShape(e.type === 'drifter' ? SH.diamond : e.type === 'dasher' ? SH.tri : e.type === 'chaser' ? SH.square : SH.pinwheel, e.x, e.y, e.ang, e.r * (1 + k * 2), d.color, { alpha: 0.25 + (1 - k) * 0.6, fill: 0.04, lw: 1.6 });
      continue; }
    const fl = e.flash > 0;
    if (e.type === 'drifter') glowShape(SH.diamond, e.x, e.y, Math.sin(e.ang) * 0.4, e.r, d.color, { inner: SH.diamondIn, flash: fl });
    else if (e.type === 'chaser') { const sq = 1 + Math.sin(G.t * 10 + e.id) * 0.06; glowShape(SH.square, e.x, e.y, e.ang, e.r * sq, d.color, { inner: SH.squareIn, flash: fl }); }

    else if (e.type === 'dasher') {

        ctx.setLineDash([10, 8]); ctx.lineDashOffset = -G.t * 120; ctx.strokeStyle = d.color; ctx.globalAlpha = 0.25 + k * 0.6 * (0.7 + 0.3 * Math.sin(G.t * 40));
        ctx.lineWidth = 2 + k * 2; ctx.beginPath(); ctx.moveTo(e.r + 4, 0); ctx.lineTo(d.dashDist, 0); ctx.stroke(); ctx.setLineDash([]); ctx.restore(); ctx.globalAlpha = 1; }
      glowShape(SH.tri, e.x, e.y, e.ang, e.r * (e.state === 'aim' ? 1 + Math.sin(G.t * 30) * 0.08 : 1), d.color, { inner: SH.triIn, flash: fl || (e.state === 'aim' && e.timer < 0.2) });
    }
  }

  // player

    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (let i = 2; i < trail.length; i += 2) { const k = 1 - i / trail.length; ctx.globalAlpha = k * 0.55; ctx.strokeStyle = C.player; ctx.lineWidth = 7 * k + 1;
      ctx.beginPath(); ctx.moveTo(trail[i - 2], trail[i - 1]); ctx.lineTo(trail[i], trail[i + 1]); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    hg.addColorStop(0, 'rgba(0,240,255,0.28)'); hg.addColorStop(1, 'rgba(0,240,255,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = hg; ctx.fillRect(player.x - 46, player.y - 46, 92, 92); ctx.globalCompositeOperation = 'source-over';
    const blink = player.invuln > 0 && Math.floor(player.invuln * 14) % 2;

    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(player.x, player.y, 2.2, 0, TAU); ctx.fill(); // true hitbox hint

      glowShape(SH.hex, player.x, player.y, time * 1.5, 30 + Math.sin(time * 8) * 1.5, C.player, { alpha: a, fill: 0.07, lw: 2.5 }); }
    if (!G.autoAim) { ctx.strokeStyle = C.player; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(input.mx, input.my, 9, 0, TAU);
      ctx.moveTo(input.mx - 15, input.my); ctx.lineTo(input.mx - 5, input.my); ctx.moveTo(input.mx + 5, input.my); ctx.lineTo(input.mx + 15, input.my);
      ctx.moveTo(input.mx, input.my - 15); ctx.lineTo(input.mx, input.my - 5); ctx.moveTo(input.mx, input.my + 5); ctx.lineTo(input.mx, input.my + 15); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  // world popups
  for (const p of popups) { const k = 1 - p.life / p.max, sc = k < 0.15 ? lerp(1.4, 1, k / 0.15) : 1;
    txt(p.text, p.x, p.y, p.size * sc, p.color, FONT_H, 900, 'center', 0, p.life < 0.25 ? p.life / 0.25 : 1); }
}

function bloom() {
  if (!supportsFilter) { // cheap fallback: soft downscale only
    bA.clearRect(0, 0, bloomA.width, bloomA.height); bA.drawImage(cv, 0, 0, bloomA.width, bloomA.height);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5; ctx.drawImage(bloomA, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; return; }
  bA.clearRect(0, 0, bloomA.width, bloomA.height);
  bA.filter = 'brightness(1.15) contrast(1.5) blur(3px)'; bA.drawImage(cv, 0, 0, bloomA.width, bloomA.height); bA.filter = 'none';
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1; ctx.drawImage(bloomA, 0, 0, cv.width, cv.height);
  if (perf.quality > 0.6) { bB.clearRect(0, 0, bloomB.width, bloomB.height); bB.filter = 'blur(5px)'; bB.drawImage(bloomA, 0, 0, bloomB.width, bloomB.height); bB.filter = 'none';
    ctx.globalAlpha = 0.7; ctx.drawImage(bloomB, 0, 0, cv.width, cv.height); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function postFx(time) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.aberr > 0 && settings.fx === 'full') { // chromatic split on player hit
    const off = G.aberr * 5 * SC;
    fA.globalCompositeOperation = 'source-over'; fA.clearRect(0, 0, fxA.width, fxA.height); fA.drawImage(cv, 0, 0, fxA.width, fxA.height);
    fA.globalCompositeOperation = 'multiply'; fA.fillStyle = '#FF0040'; fA.fillRect(0, 0, fxA.width, fxA.height);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.45 * G.aberr; ctx.drawImage(fxA, off, 0, cv.width, cv.height);
    fA.globalCompositeOperation = 'source-over'; fA.clearRect(0, 0, fxA.width, fxA.height); fA.drawImage(cv, 0, 0, fxA.width, fxA.height);
    fA.globalCompositeOperation = 'multiply'; fA.fillStyle = '#00C0FF'; fA.fillRect(0, 0, fxA.width, fxA.height);
    ctx.drawImage(fxA, -off, 0, cv.width, cv.height); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }

    g.addColorStop(0, 'rgba(255,59,48,0)'); g.addColorStop(1, `rgba(255,59,48,${(settings.fx === 'full' ? 0.45 : 0.25) * G.flash})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  ctx.drawImage(vigCv, 0, 0);
  if (scanPat && settings.fx === 'full') { ctx.globalAlpha = 0.35; ctx.fillStyle = scanPat; ctx.fillRect(0, 0, cv.width, cv.height);
    const by = ((time * 0.08) % 1.2 - 0.1) * cv.height, g = ctx.createLinearGradient(0, by - 80, 0, by + 80);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(180,220,255,0.035)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, by - 80, cv.width, 160); }
  ctx.globalAlpha = 1;
}

function drawIcon(b) {

  if (best.score > 0) txt('BEST  ' + fmt(best.score) + '   ·   PEAK ×' + (best.mult || 1), W / 2, H * 0.6 + 52, 14, C.spark, FONT_H, 700, 'center', 8);
  drawLegend(H * 0.78);
  const ctl = input.touchMode ? 'drag anywhere to move · auto-aim & auto-fire' : 'WASD / arrows move · mouse aims · auto-fire · P pause · M music · N sfx · F effects';
  txt(ctl, W / 2, H - 26 - safe.b, 14, 'rgba(232,255,255,0.55)', FONT_B, 600);
}

function rankFor(score) {
  const R = [[0, 'CADET'], [5000, 'PILOT'], [20000, 'ACE'], [50000, 'VANGUARD'], [100000, 'STARBREAKER'], [200000, 'PULSAR LEGEND']];
  let r = R[0][1]; for (const [s, n] of R) if (score >= s) r = n; return r;
}
function drawGameOver(time) {
  const k = Math.min(1, G.overT / 0.5);
  ctx.fillStyle = `rgba(5,1,15,${0.62 * k})`; ctx.fillRect(0, 0, W, H);
  const y0 = H * 0.24;
  neonTitle('GAME OVER', W / 2, y0, Math.min(84, W / 8.5) * (0.9 + 0.1 * k), C.warn, k);
  txt(rankFor(G.score), W / 2, y0 + 58, 16, C.player, FONT_H, 900, 'center', 10, k);
  txt(fmt(G.score * Math.min(1, G.overT / 0.6)), W / 2, y0 + 112, Math.min(64, W / 10), C.ui, FONT_H, 900, 'center', 20, k);
  if (G.newBest && G.overT > 0.6) txt('NEW BEST!', W / 2, y0 + 160, 22 * (1 + Math.sin(time * 8) * 0.06), C.spark, FONT_H, 900, 'center', 20);
  else if (G.prevBest > 0 && G.overT > 0.6) txt('+' + fmt(G.prevBest - G.score + 1) + ' to beat your best (' + fmt(G.prevBest) + ')', W / 2, y0 + 160, 16, 'rgba(232,255,255,0.7)', FONT_B, 700);
  const stats = [['TIME', fmtTime(G.t)], ['PEAK', '×' + G.peakMult], ['CHAIN', String(G.maxChain)], ['KILLS', String(G.kills)], ['NEAR', String(G.grazes)]];
  const sw = Math.min(120, (W - 40) / 5);
  stats.forEach(([l, v], i) => { const x = W / 2 + (i - 2) * sw;
    txt(l, x, y0 + 214, 11, 'rgba(232,255,255,0.55)', FONT_B, 700, 'center', 0, k); txt(v, x, y0 + 238, 20, C.ui, FONT_H, 900, 'center', 6, k); });
  if (G.overT > CONFIG.restartLock) { const a = 0.6 + 0.4 * Math.sin(time * 5);
    txt(input.touchMode ? 'TAP TO RETRY' : 'CLICK · SPACE TO RETRY', W / 2, y0 + 310, 20, C.player, FONT_H, 900, 'center', 16, a);
    txt(G.mode === 'daily' ? 'daily pulse · T for menu' : 'T for menu', W / 2, y0 + 340, 13, 'rgba(232,255,255,0.45)', FONT_B, 600); }
}

function drawPause() {
  ctx.fillStyle = 'rgba(5,1,15,0.6)'; ctx.fillRect(0, 0, W, H);
  txt('PAUSED', W / 2, H * 0.42, Math.min(60, W / 9), C.player, FONT_H, 900, 'center', 24);
  txt(input.touchMode ? 'tap to continue' : 'click · space · P to continue', W / 2, H * 0.42 + 52, 16, C.ui, FONT_B, 600, 'center', 0, 0.8);
}

let lastTs = 0, frameT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const realDt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000 || 0.016)); lastTs = ts; frameT += realDt;
  // adaptive quality: drop extras when frames get slow
  perf.avg = lerp(perf.avg, realDt * 1000, 0.05);
  if (perf.avg > 24 && perf.quality > 0.5) perf.quality = Math.max(0.5, perf.quality - 0.002); else if (perf.avg < 18 && perf.quality < 1) perf.quality = Math.min(1, perf.quality + 0.001);
  step(realDt);
  const time = frameT, pulse = Sound.beat();
  // shake (trauma²)
  const fxMul = settings.fx === 'full' ? 1 : 0.3, tr = G.trauma * G.trauma * fxMul;
  const sx = tr * 12 * (Math.random() * 2 - 1), sy = tr * 12 * (Math.random() * 2 - 1), rot = tr * 0.03 * (Math.random() * 2 - 1);
  // background (screen space)
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.drawImage(bgCv, 0, 0);
  // world (with shake)
  ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.translate(W / 2 + sx, H / 2 + sy); ctx.rotate(rot); ctx.translate(-W / 2, -H / 2);
  const camX = (player.x - W / 2) * 0.6 + time * 6, camY = (player.y - H / 2) * 0.6;
  drawStars(time, camX, camY); drawGrid(pulse); drawWorld(time, pulse);
  bloom(); postFx(time);
  // HUD & overlays (no shake)
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  if (G.state === 'playing' || G.state === 'paused') drawHUD(time);
  drawBanners();
  if (G.state === 'title') drawTitle(time, pulse);
  else if (G.state === 'over') drawGameOver(time);
  else if (G.state === 'paused') drawPause();
  layoutButtons(); buttons.forEach(drawIcon);
}

// boot
resize();
try { document.fonts && ['400 40px Monoton', '900 40px Orbitron', '700 20px Orbitron', '600 16px Rajdhani', '700 16px Rajdhani'].forEach(f => document.fonts.load(f)); } catch (e) {}
requestAnimationFrame(frame);
// test hook (harmless in production)
window.PULSAR = { G, get player() { return player; }, get enemies() { return enemies; }, startGame, spawnEnemy, CONFIG, settings, perf };
</script>
</body>
